# docker-compose.yml
# อ้างอิงสไลด์หน้า 50
version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ch8_backend_service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=mysql://root:@host.docker.internal:3306/ch8_shop
      - JWT_KEY=jwt-secret-key
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: ch8_frontend_service
    ports:
      - "81:80"
    depends_on:
      - backend
